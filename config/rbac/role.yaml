---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - obs.wilaris.de
  resources:
  - providerconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - obs.wilaris.de
  resources:
  - providerconfigs/finalizers
  verbs:
  - update
- apiGroups:
  - obs.wilaris.de
  resources:
  - providerconfigs/status
  verbs:
  - get
  - patch
  - update
