---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: buckets.obs.wilaris.de
spec:
  group: obs.wilaris.de
  names:
    kind: Bucket
    listKind: BucketList
    plural: buckets
    shortNames:
    - bkt
    singular: bucket
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.providerConfigRef.name
      name: ProviderConfig
      type: string
    - jsonPath: .spec.storageClass
      name: StorageClass
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Bucket is the Schema for the buckets API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Bucket
            properties:
              acl:
                default: private
                description: ACL is the canned OBS bucket ACL.
                enum:
                - private
                - public-read
                - public-read-write
                - log-delivery-write
                type: string
              enterpriseProjectID:
                description: |-
                  EnterpriseProjectID is the OBS Enterprise Project ID used when creating the bucket.
                  This setting is immutable after bucket creation.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: enterpriseProjectID is immutable
                  rule: self == oldSelf
              forceDestroy:
                default: false
                description: ForceDestroy deletes all object versions and delete markers
                  before deleting the bucket.
                type: boolean
              logging:
                description: Logging configures OBS bucket access logging.
                properties:
                  agency:
                    description: Agency is the optional agency used by OBS for log
                      delivery.
                    minLength: 1
                    type: string
                  targetBucket:
                    description: TargetBucket is the OBS bucket that receives access
                      logs.
                    minLength: 1
                    type: string
                  targetPrefix:
                    default: logs/
                    description: TargetPrefix is the prefix used for access log objects.
                    minLength: 1
                    type: string
                required:
                - targetBucket
                type: object
              parallelFS:
                default: false
                description: |-
                  ParallelFS creates the bucket with the OBS parallel file system interface.
                  This setting is immutable after bucket creation.
                type: boolean
                x-kubernetes-validations:
                - message: parallelFS is immutable
                  rule: self == oldSelf
              providerConfigRef:
                description: ProviderConfigRef references the same-namespace ProviderConfig
                  used to create an OBS client.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: providerConfigRef.name is required
                  rule: has(self.name) && self.name != ''
                - message: providerConfigRef is immutable
                  rule: self == oldSelf
              serverSideEncryption:
                description: |-
                  ServerSideEncryption configures OBS bucket default server-side encryption.
                  OBS uses the kms algorithm for this setting.
                properties:
                  kmsKeyID:
                    description: KMSKeyID is the KMS key used for bucket default encryption.
                    minLength: 1
                    type: string
                  kmsProjectID:
                    description: KMSProjectID is the optional KMS project ID used
                      for bucket default encryption.
                    minLength: 1
                    type: string
                required:
                - kmsKeyID
                type: object
              storageClass:
                default: STANDARD
                description: StorageClass is the OBS storage class applied to the
                  bucket.
                enum:
                - STANDARD
                - WARM
                - COLD
                type: string
              tags:
                additionalProperties:
                  type: string
                description: Tags are OBS bucket tags.
                type: object
              versioning:
                default: false
                description: Versioning enables OBS bucket versioning when true.
                type: boolean
            required:
            - providerConfigRef
            type: object
          status:
            description: status defines the observed state of Bucket
            properties:
              bucketDomainName:
                description: BucketDomainName is the OBS DNS name for the bucket.
                type: string
              bucketVersion:
                description: BucketVersion is the OBS bucket metadata version.
                type: string
              conditions:
                description: Conditions represent the current state of the Bucket
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncTime:
                description: LastSyncTime is the last time the bucket was observed
                  or reconciled.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the latest generation observed
                  by the controller.
                format: int64
                type: integer
              region:
                description: Region is the ProviderConfig region used for the last
                  successful observation.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'metadata.name must be an OBS bucket name: 3-63 lowercase letters,
            digits, or hyphens, starting and ending with a letter or digit'
          rule: self.metadata.name.matches('^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$')
    served: true
    storage: true
    subresources:
      status: {}
